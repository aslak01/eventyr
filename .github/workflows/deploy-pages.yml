name: Deploy to GitHub Pages

# Deploy only after CI has passed on master
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit CI ran on, not whatever master points to now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Installs the tools pinned in mise.toml
      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generated images are reused between builds; the generator checks each
      # entry against the source content and image settings, and prunes
      # outputs whose source was deleted
      - name: Cache optimized images
        uses: actions/cache@v6
        with:
          path: |
            dist/images
            dist/.image-cache.json
          key: image-cache-v5-${{ hashFiles('src/lib/books/**/*.png', 'src/lib/books/**/*.jpg', 'src/lib/books/**/*.jpeg', 'src/lib/books/**/*.gif', 'src/lib/books/**/*.svg', 'src/lib/books/**/*.webp') }}
          restore-keys: |
            image-cache-v5-

      - name: Build site
        run: bun run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
